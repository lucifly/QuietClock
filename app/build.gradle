plugins { id 'com.android.application' }
android {
    testOptions { unitTests.includeAndroidResources = true }
    namespace 'com.example.quietclock'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.quietclock'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    systemProperty 'maven.repo.local', new File(gradle.gradleUserHomeDir, 'robolectric').absolutePath
    ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','http.nonProxyHosts'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}
